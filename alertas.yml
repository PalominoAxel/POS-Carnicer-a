groups:
  - name: alertas_don_toribio_pos
    rules:
      - alert: PosCaido
        expr: up{job="pos-dontoribio"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "El servicio Don Toribio POS esta caido"
          description: "No hay respuesta del objetivo pos-dontoribio durante 30 segundos."

      - alert: ErroresEnCaja
        expr: rate(pos_ventas_total[1m]) == 0 and up{job="pos-dontoribio"} == 1
        for: 30s
        labels:
          severity: warning
          module: caja-ventas
        annotations:
          summary: "Sin actividad de ventas en caja con POS activo"
          description: "El servicio pos-dontoribio esta activo pero no se registran ventas en el ultimo minuto."

      - alert: ReporteExcelLento
        expr: histogram_quantile(0.95, sum(rate(pos_reporte_excel_seconds_bucket[5m])) by (le)) > 3
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Generacion de reporte Excel lenta"
          description: "La latencia p95 del reporte Excel supera los 3 segundos."